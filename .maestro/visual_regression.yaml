
appId: com.anonymous.VisualRegression
---

- launchApp:
    arguments:
        kind: MyButton
        name: Basic
    label: "Open iPhone 15-MyButton-Basic"
- assertVisible:
    id: mybutton--basic
    label: iPhone 15-MyButton-Basic
- waitForAnimationToEnd:
    timeout: 500
    label: Wait for anminations to settle
- takeScreenshot: iPhone 15-MyButton-Basic

- launchApp:
    arguments:
        kind: MyButton
        name: Another Example
    label: "Open iPhone 15-MyButton-AnotherExample"
- assertVisible:
    id: mybutton--another-example
    label: iPhone 15-MyButton-AnotherExample
- waitForAnimationToEnd:
    timeout: 500
    label: Wait for anminations to settle
- takeScreenshot: iPhone 15-MyButton-AnotherExample
